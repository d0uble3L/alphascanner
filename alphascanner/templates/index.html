{% extends "base.html" %}
{% block content %}
<header>
  <h1>AlphaScanner</h1>
  <span class="tag">altcoin opportunity screener</span>
</header>

<div class="presets">
  <label for="preset-select">Preset</label>
  <select id="preset-select">
    <option value="">— custom —</option>
    {% for p in presets %}
    <option value="{{ p.name }}" data-params="{{ p.query.model_dump_json() }}">{{ p.name }}</option>
    {% endfor %}
  </select>
  <input id="preset-name" placeholder="Save current filters as…" maxlength="64">
  <button type="button" id="preset-save">Save</button>
  <button type="button" id="preset-delete">Delete</button>
  <span id="preset-msg" class="msg" role="status"></span>
</div>

<details class="alerts-panel" id="alerts-panel">
  <summary>Alerts <span id="alerts-summary" class="msg"></span></summary>
  <div class="presets">
    <label for="alert-url">Webhook for the selected preset</label>
    <input id="alert-url" type="url" placeholder="https://hooks.slack.com/services/…"
           maxlength="2048" autocomplete="off" spellcheck="false">
    <button type="button" id="alert-set">Set alert</button>
    <span id="alert-msg" class="msg" role="status"></span>
  </div>
  <div id="alerts" class="panel"
       hx-get="/alerts"
       hx-trigger="load, every 60s, alerts-changed from:body">
    <div class="empty">Loading…</div>
  </div>
</details>

<form class="filters"
      hx-get="/screen"
      hx-target="#results"
      hx-trigger="change delay:200ms, submit"
      hx-include="this">
  <label>Sort by
    <select name="sort_by">
      <option value="volume_surge">Volume surge</option>
      <option value="pct_change_1h">% change 1h</option>
      <option value="pct_change_24h">% change 24h</option>
      <option value="pct_change_7d">% change 7d</option>
      <option value="volume">Volume</option>
      <option value="market_cap">Market cap</option>
    </select>
  </label>
  <label>Limit
    <input type="number" name="limit" value="20" min="1" max="200">
  </label>
  <label>Min market cap (USD)
    <input type="number" name="min_market_cap" placeholder="e.g. 10000000">
  </label>
  <label>Max market cap (USD)
    <input type="number" name="max_market_cap" placeholder="e.g. 1000000000">
  </label>
  <label>Min 24h volume (USD)
    <input type="number" name="min_volume" placeholder="e.g. 1000000">
  </label>
  <label>Min volume surge (x)
    <input type="number" name="min_volume_surge" step="0.1" placeholder="2.0">
  </label>
  <label>Min % chg 1h
    <input type="number" name="min_pct_change_1h" step="0.5">
  </label>
  <label>Min % chg 24h
    <input type="number" name="min_pct_change_24h" step="1">
  </label>
  <label>Min % chg 7d
    <input type="number" name="min_pct_change_7d" step="1">
  </label>
  <label>Near ATH (0–1)
    <input type="number" name="near_ath_pct" step="0.01" min="0" max="1" placeholder="0.95">
  </label>
</form>

<div id="results"
     hx-get="/screen"
     hx-trigger="load, every 60s"
     hx-include="form.filters">
  <div class="empty">Loading…</div>
</div>

<script>
(() => {
  const form = document.querySelector("form.filters");
  const select = document.getElementById("preset-select");
  const nameInput = document.getElementById("preset-name");
  const msg = document.getElementById("preset-msg");

  function say(text, isError = false) {
    msg.textContent = text;
    msg.classList.toggle("error", isError);
  }

  function formParams() {
    const params = {};
    for (const [key, value] of new FormData(form)) params[key] = value === "" ? null : value;
    return params;
  }

  function errorText(body) {
    // Pydantic validation errors come back as a list; our own errors as a string.
    if (typeof body.detail === "string") return body.detail;
    if (Array.isArray(body.detail)) {
      return body.detail.map((e) => `${e.loc[e.loc.length - 1]}: ${e.msg}`).join("; ");
    }
    return "Request failed.";
  }

  select.addEventListener("change", () => {
    const option = select.selectedOptions[0];
    if (!option.value) return;
    const params = JSON.parse(option.dataset.params);
    for (const [key, value] of Object.entries(params)) {
      const field = form.elements.namedItem(key);
      if (field) field.value = value ?? "";
    }
    form.requestSubmit();
    say(`Loaded "${option.value}".`);
  });

  document.getElementById("preset-save").addEventListener("click", async () => {
    // A blank name re-saves (overwrites) the currently selected preset.
    const name = nameInput.value.trim() || select.value;
    if (!name) return say("Enter a name to save these filters.", true);
    const resp = await fetch(`/api/presets/${encodeURIComponent(name)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formParams()),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) return say(errorText(body), true);

    let option = [...select.options].find((o) => o.value === body.name);
    if (!option) {
      option = new Option(body.name, body.name);
      select.add(option);
    }
    option.dataset.params = JSON.stringify(body.params);
    select.value = body.name;
    nameInput.value = "";
    say(`Saved "${body.name}".`);
  });

  const alertUrl = document.getElementById("alert-url");
  const alertMsg = document.getElementById("alert-msg");
  const alertsChanged = () => document.body.dispatchEvent(new Event("alerts-changed"));

  function sayAlert(text, isError = false) {
    alertMsg.textContent = text;
    alertMsg.classList.toggle("error", isError);
  }

  document.getElementById("alert-set").addEventListener("click", async () => {
    const name = select.value;
    if (!name) return sayAlert("Select a saved preset first.", true);
    const url = alertUrl.value.trim();
    if (!url) return sayAlert("Paste the webhook URL to notify.", true);
    const resp = await fetch(`/api/alerts/${encodeURIComponent(name)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ webhook_url: url }),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) return sayAlert(errorText(body), true);
    alertUrl.value = "";  // the full URL may hold a secret token; don't leave it on screen
    sayAlert(`Alert set on "${body.preset}" -> ${body.webhook}.`);
    alertsChanged();
  });

  document.getElementById("alerts").addEventListener("click", async (event) => {
    const button = event.target.closest("button.alert-delete");
    if (!button) return;
    const name = button.dataset.preset;
    const resp = await fetch(`/api/alerts/${encodeURIComponent(name)}`, { method: "DELETE" });
    if (!resp.ok && resp.status !== 404) {
      return sayAlert(errorText(await resp.json().catch(() => ({}))), true);
    }
    sayAlert(`Deleted the alert on "${name}".`);
    alertsChanged();
  });

  // Keep the panel's header in sync so a failing alert is visible while it's collapsed.
  document.body.addEventListener("htmx:afterSwap", (event) => {
    if (event.detail.target.id !== "alerts") return;
    const rows = event.detail.target.querySelectorAll("tbody tr").length;
    const failing = event.detail.target.querySelectorAll("td.down").length;
    const summary = document.getElementById("alerts-summary");
    summary.textContent = rows ? `${rows} active${failing ? `, ${failing} failing` : ""}` : "none";
    summary.classList.toggle("error", failing > 0);
    if (failing) document.getElementById("alerts-panel").open = true;
  });

  document.getElementById("preset-delete").addEventListener("click", async () => {
    const name = select.value;
    if (!name) return say("Select a preset to delete.", true);
    const resp = await fetch(`/api/presets/${encodeURIComponent(name)}`, { method: "DELETE" });
    if (!resp.ok && resp.status !== 404) {
      return say(errorText(await resp.json().catch(() => ({}))), true);
    }
    select.selectedOptions[0].remove();
    select.value = "";
    say(`Deleted "${name}".`);
    alertsChanged();  // deleting a preset deletes its alert
  });
})();
</script>
{% endblock %}
