services:
  web:
    build: .
    image: alphascanner:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build: .
    image: alphascanner:latest
    command: ["python", "-m", "alphascanner.scheduler"]
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      # Fails if the loop hasn't completed an iteration (success or
      # failure) in the last hour, catching a wedged scheduler even
      # though it exposes no HTTP endpoint of its own.
      test: ["CMD", "python", "-c", "import os,sys,time; p='/data/scheduler.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 3600 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
